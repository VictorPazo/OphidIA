workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS (release, sem assinatura)
        script: flutter build ios --release --no-codesign

      - name: Empacotar Runner.app em Runner.ipa
        script: |
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry Runner.ipa Payload
          ls -lh Runner.ipa

    artifacts:
      - build/ios/iphoneos/Runner.ipa
